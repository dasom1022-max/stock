name: Daily Stock Briefing (4 Times a Day)

concurrency:
  group: stock-report-bot
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 22 * * *' # 한국 시간 오전 07:00
    - cron: '0 2 * * *'  # 한국 시간 오전 11:00
    - cron: '0 5 * * *'  # 한국 시간 오후 02:00 (14:00)
    - cron: '0 9 * * *'  # 한국 시간 오후 06:00 (18:00)
  workflow_dispatch:     # 수동 즉시 실행 테스트용

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
