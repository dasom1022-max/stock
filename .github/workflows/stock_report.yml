name: Stock Report Telegram Bot

on:
  schedule:
    # 평일(월~금) KST 07:01, 11:01, 14:01, 18:01 실행
    - cron: "1 7,11,14,18 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      slot:
        description: "테스트할 회차 (07, 11, 14, 18 / 비워두면 현재 시각 기준)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock report bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_SLOT: ${{ inputs.slot }}
        run: |
          if [ -n "$TARGET_SLOT" ]; then
            python main.py --slot="$TARGET_SLOT" --force
          else
            python main.py
          fi
